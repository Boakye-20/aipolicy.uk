# Temporary: checks whether Ofcom's site is reachable from a GitHub runner.
# Delete after the test.
name: Ofcom access test

on:
  push:
    branches: [claude/project-thread-9r15pu]
    paths: [.github/workflows/ofcom-access-test.yml]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Ofcom URLs
        run: |
          UA="Mozilla/5.0 (compatible; aipolicy.uk-etl/1.0)"
          for u in \
            https://www.ofcom.org.uk/ \
            https://www.ofcom.org.uk/sitemap.xml \
            https://www.ofcom.org.uk/robots.txt \
            https://www.ofcom.org.uk/rss \
            "https://www.ofcom.org.uk/search?query=artificial+intelligence"; do
            code=$(curl -sS -m 30 -A "$UA" -o body.txt -D headers.txt -w "%{http_code}" "$u" || echo ERR)
            cf=$(grep -i '^cf-mitigated' headers.txt | tr -d '\r' || true)
            echo "$u -> $code ${cf:-no-challenge} | $(head -c 120 body.txt | tr '\n' ' ')"
          done
